<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      padding-bottom: 100px;
    }

    header {
      background-color: #440000;
      color: white;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      margin-bottom: 40px;
    }

    h2 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 8px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #440000;
      color: white;
      padding: 15px;
      text-align: center;
    }

    footer a {
      color: #74b9ff;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>私の好きなゲーム</h1>
  </header>

  <main>
    <section>
      <h2>Slay the Spire 2</h2>
      <p>
        Slay the Spire 2 は、デッキ構築型のローグライクカードゲームで、カードを集めてデッキを構築し、ダンジョンを攻略するゲームです。
      </p>
      <img src="https://github.com/uno73/myfavoritegame/blob/main/cupcake.jpg?raw=true" alt="カップケーキ">
    </section>

    <section>
      <h2>マージマンション</h2>
      <p>
        マージマンションは、フィンランドのMetacore Gamesが開発したスマートフォン向けのパズルゲームです。
      </p>
    </section>
  </main>

  <footer>
    <div>お問い合わせ：info@example.com</div>
    <div>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </div>
  </footer>

</body>
</html>
